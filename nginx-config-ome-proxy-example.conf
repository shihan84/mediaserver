# Nginx example: serve dashboard over HTTPS and proxy OME outputs via a same-origin path.
#
# Goals:
# - Avoid browser mixed-content (dashboard is https:// but OME outputs are http:// on :3333)
# - Provide stable playback URLs like:
#   https://ome.imagetv.in/ome/<app>/<stream>/playlist.m3u8
#   https://ome.imagetv.in/ome/<app>/<stream>/llhls.m3u8
#   https://ome.imagetv.in/ome/<app>/<stream>/thumbnail
# - Optional: proxy WebRTC signaling websocket over /ome as well
#
# NOTE:
# - You must already have TLS configured for this server block (certbot / ACME / etc.)
# - OME HTTP output port is typically 3333 (adjust upstream below if different)

server {
    listen 443 ssl http2;
    server_name ome.imagetv.in;

    # --- TLS config here ---
    # ssl_certificate ...
    # ssl_certificate_key ...

    # Frontend static files
    location / {
        root /var/www/ome;
        try_files $uri $uri/ /index.html;
        index index.html;
    }

    # Backend API
    location /api/ {
        proxy_pass http://127.0.0.1:3001;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection 'upgrade';
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_cache_bypass $http_upgrade;
        proxy_read_timeout 300s;
        proxy_connect_timeout 75s;
    }

    # OME outputs (HLS/LLHLS/DASH/thumbnail) over same-origin HTTPS
    location /ome/ {
        proxy_pass http://127.0.0.1:3333/;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        # Streaming-friendly timeouts
        proxy_read_timeout 3600s;
        proxy_send_timeout 3600s;

        # WebSocket upgrade (needed for WebRTC signaling if you use ws:// endpoints on the same port)
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection $connection_upgrade;
    }
}


